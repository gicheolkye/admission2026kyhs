<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 암호 입력 화면: 가운데 카드 하나. 내용은 AES-GCM으로 암호화되어 있고 맞는 암호로만 브라우저에서 풀린다 */
:root {
  --bg: #f4f5f2; --surface: #ffffff; --ink: #1d2421; --muted: #5f6b66; --line: #d9ddd8;
  --accent: #8a5a1f; --accent-soft: #f6ecdf; --bad: #b23a2e;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141917; --surface: #1c2320; --ink: #e5ebe8; --muted: #9aa8a2; --line: #303a36; --accent: #e3b26e; --accent-soft: #3a2e1a; --bad: #f08a7e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141917; --surface: #1c2320; --ink: #e5ebe8; --muted: #9aa8a2; --line: #303a36; --accent: #e3b26e; --accent-soft: #3a2e1a; --bad: #f08a7e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; display: grid; place-items: center; padding: 20px; }
.card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 14px; padding: 26px 24px 22px; display: grid; gap: 14px; }
.lock { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; }
.school { font-size: 13px; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; color: var(--muted); font-size: 14px; }
label { font-size: 13.5px; font-weight: 600; }
.row { display: flex; gap: 8px; }
input[type=password] { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 10px 16px; background: var(--accent); color: var(--surface); cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .6; cursor: progress; }
.remember { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.remember input { accent-color: var(--accent); width: 16px; height: 16px; }
.msg { min-height: 1.4em; font-size: 13.5px; color: var(--bad); }
.foot { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.foot a { color: inherit; }
</style>
</head>

<main class="card">
  <div class="lock" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <div>
    <div class="school">광영고등학교 · 교내용 자료</div>
    <h1>광영고 11개년 대입 분석 (2016~2026)</h1>
  </div>
  <p>학생 입시 결과가 들어 있어 암호를 아는 선생님만 볼 수 있어요. 내용은 암호화되어 있고, 맞는 암호를 넣으면 이 브라우저 안에서만 풀려요.</p>
  <form id="f" autocomplete="off">
    <label for="pw">암호</label>
    <div class="row" style="margin-top:6px">
      <input type="password" id="pw" required autofocus autocomplete="current-password" aria-describedby="msg">
      <button type="submit" id="go">열기</button>
    </div>
    <label class="remember" style="margin-top:10px"><input type="checkbox" id="keep"> 이 탭을 닫기 전까지 다시 묻지 않기</label>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot"><a href="https://gicheolkye.github.io/">← 수업·교육과정 자료 모음</a></div>

const KEY_NAME = "gate-key:" + location.pathname;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.data));
  const html = new TextDecoder().decode(plain);
  // 풀린 페이지를 화면 전체 크기의 내부 창(iframe srcdoc)에 띄운다. 같은 출처라 저장·다운로드 기능도 그대로 동작한다.
  const t = new DOMParser().parseFromString(html, "text/html").title;
  if (t) document.title = t;
  const fr = document.createElement("iframe");
  fr.title = t || "내용";
  fr.setAttribute("allow", "clipboard-write; fullscreen");
  fr.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";
  fr.srcdoc = html;
  document.body.replaceChildren(fr);
  document.body.style.cssText = "margin:0;padding:0;display:block;overflow:hidden";
  document.documentElement.style.overflow = "hidden";
  fr.addEventListener("load", () => { try { fr.contentWindow.focus(); } catch (_) {} });
}
async function trySaved() {
  try {
    const raw = sessionStorage.getItem(KEY_NAME);
    if (!raw) return;
    const key = await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, false, ["decrypt"]);
    await openWith(key);
  } catch (e) { try { sessionStorage.removeItem(KEY_NAME); } catch (_) {} }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "이 브라우저에서는 열 수 없어요. 최신 크롬·엣지·사파리로 열어 주세요."; return; }
  go.disabled = true; msg.style.color = "var(--muted)"; msg.textContent = "확인하는 중…";
  try {
    const key = await deriveKey(pw);
    if (document.getElementById("keep").checked) {
      try { sessionStorage.setItem(KEY_NAME, toB64(await crypto.subtle.exportKey("raw", key))); } catch (_) {}
    }
    await openWith(key);
  } catch (err) {
    msg.style.color = ""; msg.textContent = "암호가 맞지 않아요. 다시 입력해 주세요.";
    go.disabled = false; const i = document.getElementById("pw"); i.select(); i.focus();
  }
});
trySaved();
</script>
